<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEPAD FORMATIONS</title>
  

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
  margin:0;
}

input,button{
  padding:10px;
  margin:5px;
  width:90%;
  border-radius:8px;
  border:none;
}

button{
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.card{
  background:#1f2937;
  padding:10px;
  margin:10px;
  border-radius:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
</style>
</head>

<body>

<h2>📚 BEPAD FORMATIONS</h2>

<!-- LOGIN -->
<div id="login">
  <input id="name" placeholder="Nom et Prénom">
  <input id="phone" placeholder="Téléphone">
  <button onclick="enterSite()">Accéder au site</button>
</div>

<!-- MENU -->
<div id="menu" style="display:none">

  <button onclick="showSection('MATHS')">📚 MATHS</button>
  <button onclick="showSection('PHYS-CH')">⚛️ PHYS-CH</button>
  <button onclick="showSection('SVT')">🧬 SVT</button>
  <button onclick="showSection('PUBLICATIONS')">📖 PUBLICATIONS</button>
  <button onclick="showSection('GESTION_PRIVEE')">🏫 GESTION PRIVÉE</button>
  <button onclick="showSection('VIDEO')">🎥 VIDEO</button>

  <button onclick="window.location.href='contacts.html'">
    <button onclick="loadMyPurchases()">📦 MES ACHATS</button>
    📞 CONTACTS
  </button>

</div>

<div id="content"></div>

<!-- PAIEMENT -->
<div id="paymentBox" style="display:none" class="card">

  <h3>💳 Paiement Mobile Money</h3>
  <p>690306930 / 694299455</p>

  <input id="payerPhone" placeholder="Téléphone de paiement">
  <input id="transactionId" placeholder="ID transaction">

  <button onclick="submitPayment()">Envoyer</button>
  <button onclick="closePayment()">Annuler</button>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwSIMagUjrwnTOkpglXVIqB7MxznyiFw7BKhlnVH_gWcV_5kBUcxXZcE45usBgn6DRR/exec";

let currentFile = null;

/* LOGIN */
function enterSite(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  if(!name || !phone){
    alert("Nom et téléphone requis");
    return;
  }

  alert("Bienvenue " + name);

  document.getElementById("login").style.display = "none";
  document.getElementById("menu").style.display = "block";
}

/* BACK */
function backMenu(){
  document.getElementById("content").innerHTML = "";
}

/* OPEN PAYMENT */
function chooseAction(title, link, type){

  currentFile = {
    title: title,
    link: link,
    type: type
  };

  // 📖 CAS LECTURE
  if(type === "lecture"){

    document.getElementById("content").innerHTML = `
      <div class="card">
        <h3>📖 Lecture du document</h3>
        <p>✔ Accès au document</p>

        <button onclick="window.open('${link}', '_blank')">
          Ouvrir le document
        </button>
      </div>
    `;

    document.getElementById("paymentBox").style.display = "block";
    return;
  }

  // 🖨 CAS IMPRESSION
  if(type === "impression"){

    window.open(link, "_blank");

    document.getElementById("content").innerHTML = `
      <div class="card">
        <h3>📄 Document ouvert</h3>
        <p>✔ Consultez le document dans l’onglet ouvert.</p>
        <p>✔ Revenez ici pour continuer l’impression.</p>

        <button onclick="continueImpression()">
          Continuer impression
        </button>
      </div>
    `;

    return;
  }

}

/* LOAD SECTIONS */
async function showSection(section){

  document.getElementById("content").innerHTML = "<p>Chargement...</p>";

  try{

    const response = await fetch(API_URL + "?section=" + section);
    const result = await response.json();

    if(!result.success){
      document.getElementById("content").innerHTML = "<p>Erreur de section</p>";
      return;
    }
    

    let html = "";

    result.categories.forEach(cat => {

      let filesHTML = "";

      if(cat.files && cat.files.length > 0){

        cat.files.forEach(file => {
          filesHTML += `
            <div class="card">
              <h3>${file.title}</h3>

              <button onclick="chooseAction('${file.title}','${file.link}','lecture')">
                📖 Lire (500 FCFA/heure)
              </button>

              <button onclick="chooseAction('${file.title}','${file.link}','impression')">
                🖨 Imprimer (200 FCFA/page)
              </button>
            </div>
          `;
        });

      } else {
        filesHTML = "<p>Aucun fichier</p>";
      }

      html += `
        <div class="card">
          <h2>${cat.category}</h2>
          <div class="grid">${filesHTML}</div>
        </div>
      `;
    });

    document.getElementById("content").innerHTML =
      `<button onclick="backMenu()">⬅ Retour</button>` + html;

  }catch(err){
    console.log(err);
    document.getElementById("content").innerHTML = "<p>Erreur de chargement</p>";
  }
}
  function calculatePages(input){

  input = input.trim();

  if(input.includes("-")){

    const parts = input.split("-");
    const start = parseInt(parts[0].trim());
    const end = parseInt(parts[1].trim());

    if(isNaN(start) || isNaN(end) || end < start){
      return 0;
    }

    return end - start + 1;
  }

  const pages = input.split(",");

  return pages.filter(p => p.trim() !== "").length;
}
  function continueImpression(){

  const input = prompt(
    "Entrez les pages à imprimer\nExemple : 5,7,25 ou 15-21"
  );

  if(!input){
    alert("Aucune page saisie");
    return;
  }

  const cleanInput = input.trim();

  const pages = calculatePages(cleanInput);

  if(pages <= 0){
    alert("Format de pages invalide");
    return;
  }

  const amount = pages * 200;

  currentFile.pagesInput = cleanInput;
  currentFile.pages = pages;
  currentFile.amount = amount;

  // affichage paiement
  document.getElementById("paymentBox").style.display = "block";

  // feedback utilisateur (important)
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h3>🖨 Impression prête</h3>
      <p>Pages choisies : <b>${cleanInput}</b></p>
      <p>Nombre de pages : <b>${pages}</b></p>
      <p>Montant : <b>${amount} FCFA</b></p>
      <p>✔ Procédez au paiement</p>
    </div>
  `;
}

/* PAYMENT */
async function submitPayment(){

  const phone = document.getElementById("payerPhone").value;
  const trans = document.getElementById("transactionId").value;

  if(!phone || !trans){
    alert("Remplir tous les champs");
    return;
  }

  const pages = currentFile.pagesInput ? calculatePages(currentFile.pagesInput) : 0;
const amount = pages * 200;

const data = {
  name: document.getElementById("name").value,
  phone: phone,
  transactionId: trans,
  title: currentFile ? currentFile.title : "",
  action: currentFile?.type || "",
  pagesInput: currentFile.pagesInput || "",
  pages: pages,
  amount: amount,
  link: currentFile?.link || ""
};

  try {

    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(data),
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      }
    });

    const text = await res.text(); // 🔴 IMPORTANT (pas JSON direct)

    console.log("Réponse serveur:", text);

    const result = JSON.parse(text);

    if(result.success){

      alert("Demande envoyée ✔ - en attente de validation");

      document.getElementById("payerPhone").value = "";
      document.getElementById("transactionId").value = "";

      closePayment();

    } else {
      alert("Erreur serveur : " + (result.error || "inconnue"));
    }

  } catch(err){
    console.log(err);
    alert("Erreur de connexion : " + err.message);
  }
}

/* CLOSE PAYMENT */
function closePayment(){
  document.getElementById("paymentBox").style.display = "none";
}
function loadMyPurchases(){

  fetch("https://script.google.com/macros/s/AKfycbwSIMagUjrwnTOkpglXVIqB7MxznyiFw7BKhlnVH_gWcV_5kBUcxXZcE45usBgn6DRR/exec")
    .then(res => res.json())
    .then(result => {

      let html = "";

      result.data.forEach(item => {

        html += `
          <div class="card">
            <h3>${item.title}</h3>
            <p>Action : ${item.action}</p>
            <p>Statut : ${item.status}</p>
        `;

        // 📖 LECTURE
        if(item.action === "lecture" && item.status === "VALIDÉ"){

  const now = Date.now();

  let lectureStatus = "";

  if(!item.startTime || !item.endTime){
    lectureStatus = "⚠ NON CONFIGURÉ";
  }
  else if(now < item.startTime){
    lectureStatus = "🟡 PAS ENCORE ACTIF";
  }
  else if(now > item.endTime){
    lectureStatus = "🔴 EXPIRÉ";
  }
  else{
    lectureStatus = "🟢 ACTIF";
  }

  html += `
    <p>Lecture : ${lectureStatus}</p>
  `;

  if(lectureStatus === "🟢 ACTIF"){

    html += `
      <button onclick="openLecture('${item.link}', ${item.startTime}, ${item.endTime})">
        📖 LIRE LE DOCUMENT
      </button>
    `;
  }
}

        // 🖨 IMPRESSION
        if(item.action === "impression" && item.status === "VALIDÉ"){

          html += `
            <button onclick="window.open('${item.link}', '_blank')">
              🖨 IMPRIMER (${item.pagesInput})
            </button>
          `;
        }

        html += `</div>`;
      });

      document.getElementById("mesAchats").innerHTML = html;

    })
    .catch(err => {
      console.error(err);
      document.getElementById("mesAchats").innerHTML =
        "<p>Erreur de chargement</p>";
    });
}
  function openLecture(link, startTime, endTime){

  const now = Date.now();

  if(!startTime || !endTime){
    alert("Accès lecture non configuré");
    return;
  }

  if(now < startTime){
    alert("Accès pas encore activé");
    return;
  }

  if(now > endTime){
    alert("Accès lecture expiré");
    return;
  }

  window.open(link, "_blank");
}
</script>

</body>
</html>
