
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEPAD FORMATIONS</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
  margin:0;
}

input,button{
  padding:10px;
  margin:5px;
  width:90%;
  border-radius:8px;
  border:none;
}

button{
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.card{
  background:#1f2937;
  padding:10px;
  margin:10px;
  border-radius:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
</style>
</head>

<body>

<h2>📚 BEPAD FORMATIONS</h2>

<!-- LOGIN -->
<div id="login">
  <input id="name" placeholder="Nom et Prénom">
  <input id="phone" placeholder="Téléphone">
  <button onclick="enterSite()">Accéder au site</button>
</div>

<!-- MENU -->
<div id="menu" style="display:none">

  <button onclick="showSection('MATHS')">📚 MATHS</button>

  <button onclick="showSection('PHYS-CH')">⚛️ PHYS-CH</button>

  <button onclick="showSection('SVT')">🧬 SVT</button>

  <button onclick="showSection('PUBLICATIONS')">📖 PUBLICATIONS</button>

  <button onclick="showSection('GESTION_PRIVEE')">
    🏫 GESTION PRIVÉE
  </button>

  <button onclick="showSection('VIDEO')">🎥 VIDEO</button>

  <button onclick="window.location.href='contacts.html'">
    📞 CONTACTS
  </button>

</div>

<div id="content"></div>

<!-- PAIEMENT -->
<div id="paymentBox" style="display:none" class="card">

  <h3>Paiement Mobile Money</h3>
  <p>📞 690306930 / 694299455</p>

  <input id="docTitle" placeholder="Titre du document">
  <input id="payerPhone" placeholder="Téléphone">
  <input id="transactionId" placeholder="ID transaction">

  <button onclick="submitPayment()">Envoyer</button>
  <button onclick="closePayment()">Annuler</button>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwOChZhHkCEm_FCLqedNOzx9bLKbmsK2_6_MPesWpxYRi7MfwIm4lAJQn83vs3BoNk/exec";

/* LOGIN */
function enterSite(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  if(!name || !phone){
    alert("Nom et téléphone requis");
    return;
  }

  alert("Bienvenue " + name);

  document.getElementById("login").style.display = "none";
  document.getElementById("menu").style.display = "block";
}

/* RETOUR */
function backMenu(){
  document.getElementById("content").innerHTML = "";
}

/* CHARGEMENT DES RUBRIQUES (API UNIQUE) */
async function showSection(section){

  document.getElementById("content").innerHTML =
  "<p>Chargement...</p>";

  try{

    const response = await fetch(API_URL + "?section=" + section);
    const data = await response.json();

    let html = "";

    data.forEach(doc => {

      html += `
        <div class="card">
          <h3>${doc.title}</h3>

          ${doc.type === "video"
            ? `<video width="100%" controls>
                 <source src="${doc.link}">
               </video>`
            : `<button onclick="window.open('${doc.link}')">
                 📖 Ouvrir
               </button>`
          }

        </div>
      `;
    });

    document.getElementById("content").innerHTML = `
      <button onclick="backMenu()">⬅ Retour</button>
      <div class="grid">${html}</div>
    `;

  }catch(error){
    console.log(error);
    document.getElementById("content").innerHTML =
    "<p>Erreur de chargement</p>";
  }
}

/* PAIEMENT */
function submitPayment(){

  const phone = document.getElementById("payerPhone").value;
  const trans = document.getElementById("transactionId").value;

  if(!phone || !trans){
    alert("Remplir tous les champs");
    return;
  }

  alert("Paiement envoyé ✔");
  closePayment();
}

/* FERMER */
function closePayment(){
  document.getElementById("paymentBox").style.display = "none";
}

</script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCuV8lTp-j-iqlfIfxxKVL5FkX-j-7Zh_U",
  authDomain: "f-7444.firebaseapp.com",
  projectId: "f-7444"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ENVOI COMMANDES */
function sendOrder(type, section){
  const phone = document.getElementById("phone").value;

  db.collection("orders").add({
    phone: phone,
    course: section,
    action: type,
    status: "pending",
    date: Date.now()
  });
}
</script>

</body>
</html>
